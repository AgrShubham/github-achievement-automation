[project]
name = "github-achievement-studio"
version = "1.0.0"
description = "Windows desktop tool to automate, track, and verify earnable GitHub Profile Achievements without requiring local git or GitHub CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10.0",
    "pytest>=8.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
github-achievement-studio = "gh_achievement_studio.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
